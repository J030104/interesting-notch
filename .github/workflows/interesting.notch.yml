name: Build interesting.notch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    if: github.repository_id == '1449258753'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test file attachments
        run: |
          swiftc \
            boringNotch/Chat/NotchAttachment.swift \
            boringNotch/Chat/NotchScreenshot.swift \
            boringNotch/Chat/NotchComposerInput.swift \
            .github/scripts/tests/NotchAttachmentsSmoke.swift \
            -o "$RUNNER_TEMP/notch-attachments-smoke"
          "$RUNNER_TEMP/notch-attachments-smoke"

      - name: Build the development app
        run: |
          xcodebuild -version
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/interesting.notch" \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO \
            INTERESTING_NOTCH_SOURCE_REVISION="$GITHUB_SHA"

      - name: Package the app
        run: |
          app="$RUNNER_TEMP/interesting.notch/Build/Products/Release/interesting.notch.app"
          bash scripts/interesting.notch-build.sh verify "$app" "$GITHUB_SHA"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/interesting.notch.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: interesting.notch
          path: ${{ runner.temp }}/interesting.notch.zip
